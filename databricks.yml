bundle:
  name: flights-pipeline

variables:
  catalog:
    default: flights

targets:
  dev:
    default: true
    variables:
      catalog: flights

  prod:
    variables:
      catalog: flights_prod

resources:
  jobs:
    flights_pipeline_job:
      name: "Flights Pipeline [${bundle.target}]"
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1

      tasks:
        - task_key: bronze
          job_cluster_key: main_cluster
          notebook_task:
            notebook_path: ./01_load_bronze
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver
          depends_on:
            - task_key: bronze
          job_cluster_key: main_cluster
          notebook_task:
            notebook_path: ./02_build_silver
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold
          depends_on:
            - task_key: silver
          job_cluster_key: main_cluster
          notebook_task:
            notebook_path: ./03_build_gold
            base_parameters:
              catalog: ${var.catalog}

        - task_key: quality_checks
          depends_on:
            - task_key: gold
          job_cluster_key: main_cluster
          notebook_task:
            notebook_path: ./04_quality_checks
            base_parameters:
              catalog: ${var.catalog}